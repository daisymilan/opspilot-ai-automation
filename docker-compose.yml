services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    restart: unless-stopped

  # n8n: workflow orchestration for the Phase 2 lead-intelligence pipeline
  # (see workflows/lead-intelligence.json and docs/lead-intelligence.md).
  # Official image used directly — this is off-the-shelf infrastructure,
  # not application code, so it doesn't go through our own Dockerfile.
  #
  # Required env vars (see .env.example): N8N_ENCRYPTION_KEY. Read from
  # .env.local via env_file below — never hardcoded here, never committed.
  #
  # APP_BASE_URL and N8N_WEBHOOK_SECRET are NOT read as container env vars
  # by the workflows — n8n Cloud blocks `$env.*` access inside node
  # expressions by default (N8N_BLOCK_ENV_ACCESS_IN_NODE), so both
  # workflows use n8n's own Variables feature (`$vars.*`) instead, which
  # works identically on Cloud and self-hosted. Set these once via the n8n
  # UI (Settings → Variables) after import — see docs/lead-intelligence.md
  # and docs/document-intelligence.md's local setup sections.
  #
  # Runs alongside local Supabase without conflict: Supabase occupies
  # 54321-54329; n8n uses 5678 only.
  n8n:
    image: n8nio/n8n:1.72.1
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file:
      - .env.local
    environment:
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=UTC
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5678/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  n8n_data:
    name: opspilot_n8n_data
